<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTS Manager · Guararapes</title><link rel="icon" href="assets/logo_branco.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#f3f5f4;--card:#fff;--ink:#1b2430;--mut:#6a7686;--line:#e2e7e4;--g9:#123d2b;--g8:#1f5c40;--g6:#2f7d57;--g1:#e7f3ec;--yel:#fff06a;--warn:#a85a05;--warnbg:#fff4d6;--bad:#a61b1b;--badbg:#fde4e4;--ok:#17653a;--okbg:#dcf5e5;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
aside{width:236px;background:linear-gradient(180deg,var(--g9),var(--g8));color:#fff;padding:20px 14px;flex-shrink:0;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:26px}
.logo i{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--g8);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.logo b{display:block;font-size:15px}.logo small{opacity:.7;font-size:11.5px}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;color:#d9efe2;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:3px}
.nav button:hover{background:rgba(255,255,255,.09)}
.nav button.on{background:#fff;color:var(--g8);font-weight:700}
.side-foot{position:absolute;bottom:18px;left:14px;right:14px;font-size:11.5px;opacity:.65;line-height:1.4}
main{flex:1;padding:26px 30px 60px;max-width:1040px;min-width:0}
h2{margin:0;font-size:23px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:3px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,40,30,.04)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d5dcd8;border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #bfe3cd;border-color:var(--g6)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:11px;color:var(--mut);margin:12px 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.btn{border:1px solid var(--g8);background:var(--g8);color:#fff;padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--g9)}.btn.ghost{background:#fff;color:var(--g8)}.btn.ghost:hover{background:var(--g1)}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.red{background:#fff;border-color:#e7b4b4;color:var(--bad)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eef1ef;color:#46524b;margin:0 5px 4px 0}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ex{background:#e4e8ff;color:#3a3fa8}
.res{cursor:pointer;transition:.15s}.res:hover{border-color:var(--g6);transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,60,40,.09)}
.res h3{margin:0 0 5px;font-size:15px}.meta{color:var(--mut);font-size:13px}
mark{background:#ffe27a;border-radius:3px;padding:0 2px}
.hero{background:linear-gradient(135deg,var(--g9),var(--g6));color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:16px}
.hero .code{opacity:.8;font-size:12.5px;letter-spacing:.04em}.hero h2{margin:4px 0 12px;font-size:20px}
.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.hero .btn{background:#fff;color:var(--g8);border-color:#fff}.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:99px;cursor:pointer;font:inherit;color:var(--mut);white-space:nowrap;font-weight:600}
.tabs button.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.tabs .n{background:var(--badbg);color:var(--bad);border-radius:99px;padding:0 7px;margin-left:5px;font-size:11px}
.tabs button.on .n{background:#fff}
/* ficha estilo planilha */
.sheet{background:#fff;border:1px solid #cfd6d2;border-radius:6px;overflow:hidden;margin-bottom:14px}
.sh-head{background:#c9deb0;color:#2b4a1c;text-align:center;font-weight:800;letter-spacing:.02em;padding:14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head small{font-weight:700;font-size:12px;opacity:.8}
.sh-bar{background:#c5c9ce;font-weight:800;font-size:12px;padding:6px 12px;text-transform:uppercase;letter-spacing:.04em}
.sh-bar.c{text-align:center}
.sh-yel{background:var(--yel);font-weight:800;padding:8px 12px;font-size:15px}
.sh-body{padding:10px 14px}
.sh-red{color:#d10b0b;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2>div{padding:8px 14px;border-bottom:1px solid #eef1ef}
.grid2 .k{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block}
.cbl{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:13.5px}
.cb{width:15px;height:15px;border:1.6px solid #444;border-radius:3px;flex-shrink:0;margin-top:2px;position:relative}
.cb.on{background:#1b2430}.cb.on::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.two-l{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
ul.cl{margin:6px 0 0;padding-left:18px}ul.cl li{margin:3px 0}
.empty{color:var(--warn);background:var(--warnbg);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.alert{padding:11px 14px;border-radius:10px;margin-bottom:9px;font-size:13.5px}
.alert.warn{background:var(--warnbg);color:#6b3a03}.alert.bad{background:var(--badbg);color:#7c1414}.alert.ok{background:var(--okbg);color:var(--ok)}
.drop{border:2px dashed #b6c8bd;border-radius:14px;padding:26px;text-align:center;color:var(--mut);background:#fafcfb}
.drop.over{background:var(--g1);border-color:var(--g6)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.ph{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{width:100%;height:150px;object-fit:cover;display:block;cursor:zoom-in}
.ph div{padding:9px 10px}.ph select,.ph input{padding:6px 8px;font-size:12.5px;margin-bottom:6px}
.lb{position:fixed;inset:0;background:rgba(10,20,15,.88);display:grid;place-items:center;z-index:9;padding:20px}.lb img{max-width:100%;max-height:92vh;border-radius:10px}
.toast{position:fixed;bottom:20px;right:20px;background:#1b2430;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:10;max-width:320px}.toast.show{opacity:1}
.banner{background:#e4e8ff;color:#3a3fa8;padding:9px 13px;border-radius:10px;margin-bottom:14px;font-size:13px}
.srch{font-size:15px;padding:13px 16px}
@media(max-width:760px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}.logo{margin-bottom:10px}.nav{display:flex;gap:4px;overflow-x:auto}.nav button{white-space:nowrap;width:auto;padding:8px 12px}.side-foot{display:none}main{padding:16px 14px 50px}.row,.row3,.grid2,.two,.two-l{grid-template-columns:1fr}}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin:14px 6px 5px}
.stp{display:flex;gap:6px;flex-wrap:wrap}
.st{flex:1;min-width:120px;display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--mut);font-weight:600;font-size:12.5px}
.st i{width:24px;height:24px;border-radius:50%;background:#e6ebe8;display:grid;place-items:center;font-style:normal;font-size:12px;flex-shrink:0}
.st.done{color:var(--ok);background:var(--okbg);border-color:#bfe8cf}.st.done i{background:var(--ok);color:#fff}
.st.cur{color:#fff;background:var(--g8);border-color:var(--g8)}.st.cur i{background:#fff;color:var(--g8)}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;font-size:12px;color:var(--mut)}.sign hr{border:0;border-top:1.5px solid #555;margin:0 0 5px}
.itb input{padding:7px 9px;font-size:13px}.itb td{padding:5px 6px;vertical-align:middle}
.lnk{color:var(--g6);font-weight:600;text-decoration:none}.lnk:hover{text-decoration:underline}
@media(max-width:760px){.sign{grid-template-columns:1fr}.nav .grp{display:none}}
.itb td:nth-child(2){min-width:280px}.itb td:nth-child(1){min-width:130px}.itb td:nth-child(5){min-width:150px}
main.up,main.up *{text-transform:uppercase}main.up input,main.up textarea{text-transform:uppercase}main.up .lnk{text-transform:none}
.itb td:nth-child(2){min-width:130px}.itb td:nth-child(3){min-width:300px}.itb td:nth-child(5){min-width:90px}
.d-el{background:#4b5260!important;color:#ffe600!important}
.d-me{background:#5b8bc9!important;color:#39ff14!important;text-shadow:0 1px 1px rgba(0,40,10,.65)}
.chip.d-el,.chip.d-me{font-weight:800}
.card.bd-el{border-left:7px solid #4b5260}.card.bd-me{border-left:7px solid #5b8bc9}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{font-size:28px;display:block;line-height:1.1}.kpi span{color:var(--mut);font-size:11px;font-weight:700}.kpi.bad b{color:var(--bad)}
.dpanel{border-radius:14px;padding:16px;margin-bottom:14px}.dpanel h3{margin:0 0 8px;font-size:17px}
.dpanel .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.3)}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;margin-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;text-align:center;font-size:11px;color:var(--mut);font-weight:700}
.bars .seg{display:grid;place-items:center;font-size:11px;font-weight:800;background:#cfd6d2;color:#333}
.legend{margin-top:6px}.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.res-row:hover{background:var(--g1)}
.itb select{min-width:130px}.itb td:nth-child(3) input{min-width:220px}
/* ===== identidade Guararapes ===== */
:root{--bg:#f7f4ee;--line:#e2d8c3;--g9:#161616;--g8:#2a2a2a;--g6:#e5811c;--g1:#fdeede}
aside{background:#202020!important;border-right:4px solid #f09030}
.logo img{width:46px;height:46px}.logo small{opacity:.75}
.nav button{color:#e9e9e9}.nav button.on{background:#f09030;color:#202020}
.btn:not(.ghost):not(.red){background:#e5811c;color:#fff}.btn:not(.ghost):not(.red):hover{background:#c8670d}
.kpi{border-top:4px solid #5f7a2e}.hero{background:linear-gradient(135deg,#202020,#3a3a3a)!important}
.tabs button.on{border-color:#e5811c!important;color:#c8670d!important}
#gate{min-height:100vh;display:none;place-items:center;background:#f7f4ee;padding:16px}
.gbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;width:min(420px,100%);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.glogo{width:190px;display:block;margin:0 auto 6px}.gbox h2{text-align:center;margin:0 0 14px}
.gbox label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.gbox input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.side-foot{font-size:12px;opacity:.9}
@media(max-width:760px){.side-foot{display:block;position:static;margin-top:8px}.logo img{width:34px;height:34px}}
.tabs button.on{background:#e5811c!important;color:#fff!important;border-color:#e5811c!important}
.glogo{width:160px}
/* ===== fotos, editor, prévia, aprovação ===== */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ph{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph img{width:100%;display:block;cursor:pointer;background:#111}
.ph>div{padding:10px;display:grid;gap:8px}
.ph textarea,.ph select,.card textarea,.edb textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font:inherit}
.cptxt{width:100%;min-height:360px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fcfbf8}
.apr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 14px;margin:0 0 12px;background:#fff;color:#202020}
.apr.ok{border-left:6px solid #17653a}.apr.bad{border-left:6px solid #a61b1b}.apr.wait{border-left:6px solid #e5811c}
.edm{position:fixed;inset:0;z-index:80;background:#151515;display:flex;flex-direction:column;color:#fff}
.edt{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;padding:8px 10px;background:#202020}
.edt .btn.ghost{color:#fff;border-color:#777}.edt .tl.on{background:#e5811c;border-color:#e5811c}
.cor{width:28px;height:28px;border-radius:50%;border:2px solid #666;cursor:pointer}.cor.on{border-color:#fff;box-shadow:0 0 0 2px #e5811c}
.edc{flex:1;display:grid;place-items:center;overflow:auto;padding:6px;min-height:0}
#edcv{max-width:100%;max-height:100%;touch-action:none;background:#000}
.edb{padding:10px;background:#202020}.edb label{font-size:11px;font-weight:700;opacity:.8}
.pvw{position:fixed;inset:0;z-index:90;background:#2a2a2a;display:flex;flex-direction:column}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#202020;color:#fff}
.pvh .btn.ghost{color:#fff;border-color:#777;text-decoration:none}.pvw iframe{flex:1;border:0;background:#fff}
.lb{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.88);display:grid;place-items:center}.lb img{max-width:96%;max-height:96%}

.rq{color:#c0392b;font-weight:800}

.impm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}.impb{background:#fff;border-radius:14px;max-width:860px;width:100%;padding:18px}

.d-pr{background:#5f7a2e!important;color:#fff!important}.d-ou{background:#8a8f98!important;color:#fff!important}
.chip.d-pr,.chip.d-ou{font-weight:800}
.card.bd-pr{border-left:7px solid #5f7a2e}.card.bd-ou{border-left:7px solid #8a8f98}
.tabs.gui{margin:0 0 10px;flex-wrap:wrap}
.sdt{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.sdt button{border:1px solid var(--g6,#2f7d4f);background:#fff;color:var(--g6,#2f7d4f);padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer}
.sdt button.on{background:var(--g6,#2f7d4f);color:#fff}
</style></head>
<body><div id="gate"></div><div class="app" style="display:none"><aside><div class="logo"><img src="assets/logo_branco.png" alt=""><div><b>FTS Manager</b><small>Guararapes · Manutenção</small></div></div>
<div class="nav" id="nav"><button data-v="dash" class="on">📊 DASHBOARD</button><div class="grp">Serviços</div><button data-v="busca">🛠 FTS · Serviços</button><button data-v="nova">➕ Nova FTS</button><div class="grp">Compras</div><button data-v="cm">📦 CM · Compra de material</button><button data-v="ce">🔧 CE · Conserto externo</button><div class="grp">Base</div><button data-v="cat">🗂 Catálogo de itens</button><button data-v="areas">🏭 Áreas e donos</button><button data-v="admin" style="display:none">⚙️ Administração</button></div>
<div class="side-foot"><div id="who"></div><button id="sair" class="btn ghost sm" style="margin-top:8px">Sair</button></div></aside><main id="main"></main></div><div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

// ===== DASHBOARD e ÁREAS E DONOS =====
function dashFiltros(){const y=new Date().getFullYear();state.dy=state.dy||y;state.dd=state.dd??"";state.da=state.da||"";}
function escopo(){if(!ME||ME.master||ME.funcao==="PCM")return{disc:null,areas:null};
 let d=dOk(ME.disc)?ME.disc:(SETOR_DISC[ME.setor]??null);
 let ar=null;if(["DONO_AREA","EXECUTANTE"].includes(ME.funcao)){const m=AREAS.filter(a=>(EQUIPE[a]||[]).some(x=>x.pid===ME.id));if(m.length)ar=m;}
 return{disc:d,areas:ar};}
const scOk=(disc,area)=>{const E=escopo();return(E.disc==null||disc===E.disc)&&(!E.areas||E.areas.includes(area));};
const mOk=(disc,area)=>scOk(disc,area)&&(state.dd===""||disc===+state.dd)&&(!state.da||area===state.da);
function dashLinhas(){const L=[];CMS.forEach(c=>{const d=dataCompra(c);if(!d||+d.slice(0,4)!==+state.dy)return;c.itens.forEach(it=>{if(mOk(it.disc,it.area))L.push({d,c,it});});});return L.sort((a,b)=>b.d.localeCompare(a.d));}
function vDash(){dashFiltros();
 const L=dashLinhas(),h=hojeISO();
 const cmF=CMS.filter(c=>c.itens.some(i=>mOk(i.disc,i.area))),ceF=CES.filter(e=>mOk(e.disc,e.area));
 const kp={itens:L.length,aguard:cmF.filter(c=>c.status<=1).length,compra:cmF.filter(c=>c.status===2).length,rec:cmF.filter(c=>c.status===3).length,
  ceAb:ceF.filter(e=>ceAberto(e)).length,ceAtr:ceF.filter(e=>ceAberto(e)&&e.dtPrev&&e.dtPrev<h).length};

const nrs=t=>[...new Set((String(t).match(/NR[- ]?\d{1,2}/gi)||[]).map(x=>x.toUpperCase().replace(/[- ]/,"")))].sort((a,b)=>parseInt(a.slice(2))-parseInt(b.slice(2)));
const dtBR=s=>s?String(s).slice(0,10).split("-").reverse().join("/"):"—";

// ---------- copiar ----------
async function copiar(t){try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(_){}a.remove();}toast("Copiado! Cole onde quiser.");}

// ---------- aprovação do supervisor ----------
const podeAprovar=()=>ME&&(ME.master||["SUPERVISOR","COORDENADOR"].includes(ME.funcao));
const aprSt=o=>(o.aprovacao&&o.aprovacao.status)||"";
const aprChip=o=>aprSt(o)==="APROVADA"?'<span class="chip ok">✔ APROVADA</span>':aprSt(o)==="REPROVADA"?'<span class="chip bad">✖ REPROVADA</span>':'<span class="chip warn">⏳ AGUARDA APROVAÇÃO</span>';
const aprTxt=o=>{const a=o.aprovacao||{};return aprSt(o)?`${aprSt(o)} por ${a.por} (mat. ${a.matricula}) em ${dtBR(a.em)}${a.obs?" — "+a.obs:""}`:"AGUARDANDO APROVAÇÃO DO SUPERVISOR";};
function aprBox(o,tab){const s=aprSt(o),a=o.aprovacao||{};
 return `<div class="apr ${s==="APROVADA"?"ok":s==="REPROVADA"?"bad":"wait"}"><div><b>${s==="APROVADA"?"✔ APROVADA PELO SUPERVISOR":s==="REPROVADA"?"✖ REPROVADA":"⏳ AGUARDANDO APROVAÇÃO DO SUPERVISOR"}</b>${s?`<div class="meta">${esc(a.por)} · ${dtBR(a.em)}${a.obs?" · "+esc(a.obs):""}</div>`:""}</div>${podeAprovar()?`<div class="act"><button class="btn" data-apr="1" data-tab="${tab}">✔ APROVAR</button><button class="btn red" data-apr="0" data-tab="${tab}">✖ REPROVAR</button></div>`:""}</div>`;}
async function aprovar(tab,id,ok){let obs="";if(!ok){obs=prompt("Motivo da reprovação:")||"";if(!obs)return;}
 const r=await SB.rpc("aprovar",{p_tab:tab,p_id:id,p_ok:ok,p_obs:obs});if(r.error)return dbErr(r.error,"Sem permissão para aprovar");await loadAll();toast(ok?"Aprovada":"Reprovada");render();}

 const mo=(f.mo||[]).map(m=>`${m.q||"—"}× ${m.f}${m.nr?" ("+m.nr+")":""}`);
 const L=[`JUSTIFICATIVA TÉCNICA — ${f.titulo}`,`SS/OM ${f.ssom} · ${f.linha} · ${f.area} · ${per}`,"",
 "1. OBJETO",`Solicita-se a autorização para execução do serviço "${f.titulo}", na área ${f.area} (${f.linha}), SS/OM ${f.ssom}, classificado como ${TIPOS[f.tipo]||"—"} (${CLASSIF[f.classif]||"—"}), programado para ${per}.`+(f.areaOp||dOk(f.disc)?` Especialidade: ${dOk(f.disc)?DISC[f.disc]:"a definir"}${f.areaOp?" · Área operacional: "+f.areaOp+(donoDe(f.areaOp)?" (dono: "+donoDe(f.areaOp)+")":""):""}.`:""),"",

 ...(J.hist?[`Condição atual / histórico: ${J.hist}`,""]:[]),
 `A execução dos trabalhos acima, dentro da janela programada (${per}), visa preservar a confiabilidade, a disponibilidade e a segurança operacional do equipamento, aproveitando a janela planejada para intervir de forma organizada, com mão de obra, ferramental e materiais previamente dimensionados, em vez de depender de intervenções emergenciais durante a operação.`,"",
 `Consequência da não execução: ${J.conseq||"aumento do risco de falhas não planejadas e de parada emergencial, com perda de produção, maior custo de reparo e exposição das equipes a intervenções em condição não programada."}`,"",
 `Benefício esperado: ${J.benef||"redução do risco de falhas, maior previsibilidade da manutenção e manutenção das condições seguras de operação, dentro do planejamento aprovado."}`,"",
 "4. PLANEJAMENTO E RESPONSÁVEIS",`• Período: ${per}`,`• Responsável técnico: ${f.rt||"a definir"}`,`• Supervisor da área: ${f.sup||"a definir"}`,`• Planejador: ${f.plan||"a definir"}`,`• Solicitante: ${f.solicitante||"—"}`,...(f.acomp?[`• Acompanhamento: ${f.acomp}`]:[]),"",
 "5. RECURSOS",`• Mão de obra: ${mo.join("; ")||"a definir"}`,`• Ferramental: ${kit.length?kit.length+" item(ns) da caixa de ferramentas padrão (lista na aba C.3)":"conforme necessidade da atividade"}`,...((f.forn||[]).length?[`• Fornecedores homologados: ${f.forn.join(", ")}`]:[]),...((f.reqMO||[]).length?["• Requisitos da mão de obra:",...f.reqMO.map(x=>"   – "+x)]:[]),"",
 "6. SEGURANÇA E CONFORMIDADE",`• EPIs obrigatórios: ${(f.epis||[]).map(e=>e[0]).join(", ")||"conforme norma interna"}.`,...(nr.length?[`• Normas regulamentadoras aplicáveis aos trabalhos: ${nr.join(", ")}.`]:[]),"• Bloqueio e etiquetagem do equipamento, emissão de PT/RT e liberação da área antes do início, conforme procedimentos da planta.","",
 "7. CONCLUSÃO E SOLICITAÇÃO",`Diante do exposto, solicita-se a aprovação para execução do serviço conforme escopo, prazo e recursos acima descritos.`,`Situação da aprovação do supervisor: ${aprTxt(f)}.`];
 return L.join("\n");}
const MOTIVOS=["SUBSTITUIÇÃO POR DESGASTE","QUEBRA","ADEQUAÇÃO","MELHORIA","ESTOQUE CRÍTICO","NOVO PROJETO"];
const IMPACTO_PADRAO={"SUBSTITUIÇÃO POR DESGASTE":"A não aquisição mantém em operação componentes desgastados, com risco de falha não planejada, parada do equipamento, perda de produção e aumento de manutenção corretiva.","QUEBRA":"Sem o material, o equipamento permanece indisponível ou operando com restrição, com perda de produção e risco de agravamento do dano.","ADEQUAÇÃO":"Sem o material, a adequação fica pendente, mantendo risco de segurança e/ou de não conformidade no equipamento.","MELHORIA":"Sem o material, a melhoria não é implantada e permanecem as perdas e limitações atuais do equipamento.","ESTOQUE CRÍTICO":"Sem a reposição, o estoque fica abaixo do nível mínimo, com risco de não atender manutenções corretivas e de aumentar o tempo de parada.","NOVO PROJETO":"Sem o material, o projeto não avança e o cronograma de implantação fica comprometido."};
function justCm(c){const J=c.just||{},sig=siglaDe(c),ss=[...new Set(c.itens.map(i=>i.ss).filter(Boolean))],as=[...new Set(c.itens.map(i=>i.area).filter(Boolean))];
 const eq=[...new Set(c.itens.map(i=>i.equip).filter(Boolean))],fs=ss.map(x=>ftsPorSS(x)).filter(Boolean);
 const local=J.local||((eq.length?eq.join(" / "):"equipamento a definir")+(as.length?" — "+as.join(" / "):"")),

 "5. MATERIAIS SOLICITADOS",...c.itens.flatMap((i,n)=>[`Item ${n+1}`,`Solicitação de serviço: ${i.ss||"—"}`,`Equipamento: ${i.equip||"—"}`,`Modelo: ${i.modelo||"—"}`,`Item: ${i.item||i.desc||"—"}${i.item&&i.desc?" — "+i.desc:""}`,`Quantidade: ${i.qtd} ${i.un||"pç"}`,""]),
 "6. ÁREAS E RESPONSÁVEIS",...(as.length?as.map(a=>`• ${a}: ${donoDe(a)||"dono não cadastrado"}`):["• A definir"]),"",
 `Situação da aprovação do supervisor: ${aprTxt(c)}.`].join("\n");}
function pgJust(o,tipo){const J=o.just||{},fields=tipo==="fts"?[["hist","Condição atual / histórico do equipamento (opcional)"],["conseq","Consequência da não execução (substitui o texto padrão)"],["benef","Benefício esperado (substitui o texto padrão)"]]:[["local","1. Local/equipamento (vazio = automático dos itens)"],["atividade","2. Atividade ou intervenção (vazio = título da FTS da SS)"],["motivo","3. Motivo — detalhe (além do tipo escolhido)"],["impactos","4. Impactos operacionais e/ou riscos (vazio = texto padrão do motivo)"]];

 <div class="card"><div class="act"><button class="btn" id="cpj">📋 COPIAR JUSTIFICATIVA</button>${tipo==="fts"?"":`<button class="btn ghost" id="cpmail">📧 COPIAR E ABRIR E-MAIL</button>`}</div><textarea id="jtxt" readonly class="cptxt">${esc(txt)}</textarea></div>`;}

 "OBRIGAÇÕES GUARARAPES",...(f.obrG||[]).map(x=>`• ${x[0]}`),"","OBRIGAÇÕES DA CONTRATADA",...(f.obrC||[]).map(x=>`• ${x[0]}`),"","EPIs",...(f.epis||[]).map(e=>`• ${e[0]} — ${e[1]}`),"",

// ---------- fotos: câmera/galeria + marcação ----------
function desenha(ctx,W,H,S){const k=W/900;S.forEach(s=>{ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineWidth=s.w*k;ctx.lineCap=ctx.lineJoin="round";
 if(s.t==="pen"){ctx.beginPath();s.p.forEach((q,i)=>i?ctx.lineTo(q[0]*W,q[1]*H):ctx.moveTo(q[0]*W,q[1]*H));ctx.stroke();}
 else if(s.t==="arrow"){const x1=s.x1*W,y1=s.y1*H,x2=s.x2*W,y2=s.y2*H,a=Math.atan2(y2-y1,x2-x1),h=s.w*k*4+10;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));ctx.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));ctx.closePath();ctx.fill();}
 else if(s.t==="circle"){ctx.beginPath();ctx.ellipse((s.x1+s.x2)/2*W,(s.y1+s.y2)/2*H,Math.max(2,Math.abs(s.x2-s.x1)/2*W),Math.max(2,Math.abs(s.y2-s.y1)/2*H),0,0,7);ctx.stroke();}
 else if(s.t==="rect"){ctx.strokeRect(Math.min(s.x1,s.x2)*W,Math.min(s.y1,s.y2)*H,Math.abs(s.x2-s.x1)*W,Math.abs(s.y2-s.y1)*H);}
 else if(s.t==="text"){const fs=Math.round(W/22);ctx.font=`bold ${fs}px Inter,Arial,sans-serif`;ctx.lineWidth=fs/6;ctx.strokeStyle="#000";ctx.strokeText(s.s,s.x*W,s.y*H);ctx.fillText(s.s,s.x*W,s.y*H);}});}
const imgDe=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
async function flatten(p){if(!p.anot||!p.anot.length)return{data:p.data,w:p.w,h:p.h};const im=await imgDe(p.data);if(!im)return{data:p.data,w:p.w,h:p.h};const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const x=c.getContext("2d");x.drawImage(im,0,0);desenha(x,c.width,c.height,p.anot);return{data:c.toDataURL("image/jpeg",.8),w:c.width,h:c.height};}
async function flatPhotos(id){await loadPhotos(id);return Promise.all((photos[id]||[]).map(async p=>({cat:p.cat,leg:p.leg,...(await flatten(p))})));}
const catSel=(p)=>`<select data-pc="${p.id}">${CATS.map(c=>`<option ${c===p.cat?"selected":""}>${c}</option>`).join("")}</select>`;
function pgFotos(f){loadPhotos(f.id);const L=photos[f.id]||[];
 return `<div class="sheet"><div class="sh-head"><span></span><span>E.5 · FOTOS DOS TRABALHOS</span><small>${L.length} FOTO(S)</small></div><div class="sh-body">
 <div class="act"><button class="btn" id="cam">📷 TIRAR FOTO</button><button class="btn ghost" id="gal">🖼 GALERIA</button></div>
 <input type="file" id="fcam" accept="image/*" capture="environment" style="display:none"><input type="file" id="fgal" accept="image/*" multiple style="display:none">
 <div class="meta" style="margin:8px 0 12px">Toque na foto para marcar com setas, círculos, retângulos e texto. As fotos são reduzidas automaticamente e saem no PDF com as marcações e a explicação.</div>
 <div class="photos">${L.map((p,i)=>`<div class="ph"><img src="${p.prev||p.data}" data-ed="${p.id}"><div><b>FOTO ${i+1}</b>${catSel(p)}<textarea data-pl="${p.id}" rows="3" placeholder="Explique o que a foto mostra…">${esc(p.leg)}</textarea><div class="act"><button class="btn sm" data-ed="${p.id}">✏️ MARCAR</button><button class="btn red sm" data-pd="${p.id}">REMOVER</button></div></div></div>`).join("")}</div>
 ${L.length?"":'<div class="meta">Nenhuma foto ainda.</div>'}</div></div>`;}
function lightbox(src){const l=document.createElement("div");l.className="lb";l.innerHTML=`<img src="${src}">`;l.onclick=()=>l.remove();document.body.appendChild(l);}
function editorFoto(rid,pid){const p=photos[rid].find(x=>x.id===pid);if(!p)return;const S=JSON.parse(JSON.stringify(p.anot||[]));let tool="arrow",cor="#ff2d2d",esp=5,cur=null,im=null;
 const m=document.createElement("div");m.className="edm";
 m.innerHTML=`<div class="edt"><div class="act">${[["arrow","↗ SETA"],["circle","◯ CÍRCULO"],["rect","▭ RETÂNGULO"],["pen","✎ LIVRE"],["text","T TEXTO"]].map(t=>`<button class="btn ghost sm tl" data-tl="${t[0]}">${t[1]}</button>`).join("")}</div>
 <div class="act">${["#ff2d2d","#ffe600","#39ff14","#ffffff","#111111"].map(c=>`<button class="cor" data-c="${c}" style="background:${c}"></button>`).join("")}<select id="esp"><option value="3">FINO</option><option value="5" selected>MÉDIO</option><option value="9">GROSSO</option></select><button class="btn ghost sm" id="und">↶ DESFAZER</button><button class="btn ghost sm" id="lmp">LIMPAR</button></div></div>
 <div class="edc"><canvas id="edcv"></canvas></div>
 <div class="edb"><label>EXPLICAÇÃO DA FOTO</label><textarea id="edl" rows="2">${esc(p.leg)}</textarea><div class="act" style="margin-top:8px"><button class="btn" id="eds">💾 SALVAR</button><button class="btn ghost" id="edx">CANCELAR</button></div></div>`;
 document.body.appendChild(m);const cv=m.querySelector("#edcv"),cx=cv.getContext("2d");
 const redraw=()=>{if(!im)return;cx.clearRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);desenha(cx,cv.width,cv.height,cur?S.concat([cur]):S);};
 imgDe(p.data).then(i=>{im=i;cv.width=i.width;cv.height=i.height;redraw();});
 const hl=()=>{m.querySelectorAll(".tl").forEach(b=>b.classList.toggle("on",b.dataset.tl===tool));m.querySelectorAll(".cor").forEach(b=>b.classList.toggle("on",b.dataset.c===cor));};hl();
 m.querySelectorAll(".tl").forEach(b=>b.onclick=()=>{tool=b.dataset.tl;hl();});m.querySelectorAll(".cor").forEach(b=>b.onclick=()=>{cor=b.dataset.c;hl();});
 m.querySelector("#esp").onchange=e=>esp=+e.target.value;m.querySelector("#und").onclick=()=>{S.pop();redraw();};m.querySelector("#lmp").onclick=()=>{S.length=0;redraw();};
 const pt=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];};
 cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);
  if(tool==="text"){const t=prompt("Texto da marcação:");if(t){S.push({t:"text",x,y,s:t,c:cor,w:esp});redraw();}return;}
  cur=tool==="pen"?{t:"pen",p:[[x,y]],c:cor,w:esp}:{t:tool,x1:x,y1:y,x2:x,y2:y,c:cor,w:esp};};
 cv.onpointermove=e=>{if(!cur)return;const[x,y]=pt(e);if(cur.t==="pen")cur.p.push([x,y]);else{cur.x2=x;cur.y2=y;}redraw();};
 cv.onpointerup=()=>{if(!cur)return;const c=cur;cur=null;const tiny=c.t!=="pen"&&Math.abs(c.x2-c.x1)<.01&&Math.abs(c.y2-c.y1)<.01;if(!tiny)S.push(c);redraw();};
 m.querySelector("#edx").onclick=()=>m.remove();
 m.querySelector("#eds").onclick=async()=>{p.anot=S;p.leg=m.querySelector("#edl").value;p.prev=(await flatten(p)).data;await fotoUpd(p,{anot:S,legenda:p.leg});m.remove();toast("Foto salva");render();};}

 return `<div class="sheet"><div class="sh-head"><span></span><span>FICHA TÉCNICA SERVIÇO – FTS · PÁG. 2</span><small>${esc(f.id)}</small></div>
 <div class="sh-bar">Descrição geral do serviço</div><div class="sh-body"><b>${esc(f.titulo)}</b></div>
 <div class="sh-bar">O que precisa</div><div class="sh-body">${esc(f.oQue)}</div>
 <div class="sh-bar">Como</div><div class="sh-body">${val(f.como)}</div>
 <div class="two"><div><div class="sh-bar">Obrigações da Guararapes</div><div class="sh-body">${o(f.obrG)}</div></div><div><div class="sh-bar">Obrigações da contratada</div><div class="sh-body">${o(f.obrC)}</div></div></div>
 <div class="sh-bar">Lista de EPIs e ferramentas</div><div class="sh-body">${f.epis.map(e=>cbl(e[0]+" — "+e[1],e[2])).join("")}</div>
 <div class="grid2"><div><span class="k">Período</span>${val(f.periodo)}</div><div><span class="k">Responsável técnico</span><b>${esc(f.rt)}</b></div><div style="grid-column:1/-1"><span class="k">Forma de acompanhamento</span>${val(f.acomp)}</div></div></div>`;}
function pgFerr(f){const q=state.fq||"";const L=FERRAMENTAS.filter(t=>f.ferr.includes(t.cod)&&(!q||norm(t.cod+" "+t.desc).includes(norm(q))));
 return `<div class="sheet"><div class="sh-head"><span></span><span>CAIXA DE FERRAMENTA PADRÃO</span><small>${L.length} itens</small></div><div class="sh-body"><input id="fq" placeholder="Filtrar ferramenta ou código…" value="${esc(q)}"><div class="two-l" style="margin-top:10px">${L.map(t=>`<div style="display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #eef1ef"><b style="width:46px;color:var(--mut)">${esc(t.qtd)}</b><span style="flex:1">${hl(t.desc,q)}</span><span class="meta">${t.cod}</span></div>`).join("")}</div></div></div>`;}
function pgEpi(f){return `<div class="sheet"><div class="sh-head"><span></span><span>EPI – EQUIPAMENTO DE PROTEÇÃO INDIVIDUAL</span><small>NR-6</small></div><div class="sh-body">${EPI_TEXTO.map(t=>`<p style="margin:8px 0">${esc(t)}</p>`).join("")}</div></div>`;}
function pgVal(f){const p=pend(f);return (p.length?p.map(x=>`<div class="alert warn">⚠ ${esc(x)}</div>`).join(""):'<div class="alert ok">✔ Sem pendências de preenchimento.</div>')+f.alertas.map(a=>`<div class="alert ${a[0]}">${esc(a[1])}</div>`).join("");}
function vDetalhe(){const f=FTS.find(x=>x.id===state.sel);if(!f)return vBusca();const n=pend(f).length+f.alertas.length;const np=(photos[f.id]||[]).length;
 const tabs=[["p1","A.1 · FTS Pág. 1"],["p2","B.2 · FTS Pág. 2"],["ferr","C.3 · Ferramentas"],["epi","D.4 · EPIs"],["fotos","E.5 · Fotos dos trabalhos"+(np?` (${np})`:"")],["mat","Materiais / SDCV"+(sdNFts(f)?` (${sdNFts(f)})`:"")],["sdcv","SDCV"+(f.sdcv&&f.sdcv.num?" ✓":"")],["just","Justificativa técnica"],["copy","📋 Copiar tudo"],["val","Validação"]];
 const body={p1:pg1,p2:pg2,ferr:pgFerr,epi:pgEpi,fotos:pgFotos,mat:pgMat,sdcv:sdcvTab,just:x=>pgJust(x,"fts"),copy:x=>pgCopy(x,"fts"),val:pgVal}[state.tab](f);
 return `<button class="btn ghost sm" id="back">← Voltar</button>
 <div class="hero" style="margin-top:12px"><div class="code">${esc(f.id)} · SS/OM ${esc(f.ssom)}</div><h2>${esc(f.titulo)}</h2>
 <div style="margin-bottom:12px"><span class="chip">${esc(f.linha)} · ${esc(f.area)}</span><span class="chip">${esc(TIPOS[f.tipo])}</span><span class="chip">${esc(f.periodo)}</span><span class="chip">${esc(f.status)}</span>${f.sdcv&&f.sdcv.num?`<span class="chip">SDCV ${esc(f.sdcv.num)}</span>`:""}${f.exemplo?'<span class="chip">exemplo fictício</span>':""}</div>
 <div style="margin-bottom:12px">${discChip(f.disc)}${areaChip(f.areaOp)}${aprChip(f)}</div>
 <div class="act" style="margin-bottom:10px"><select id="fdisc" style="width:auto">${optEsp(f.disc,"— ESPECIALIDADE —",espPerm())}</select><select id="farea" style="width:auto">${optAreas(f.areaOp,"— ÁREA —")}</select></div>
 ${aprBox(f,"fts")}
 <div class="act"><button class="btn" id="pdf">👁 Visualizar / baixar PDF</button><button class="btn ghost" id="dup">Duplicar como nova FTS</button></div></div>
 <div class="tabs">${tabs.map(t=>`<button data-t="${t[0]}" class="${state.tab===t[0]?"on":""}">${t[1]}${t[0]==="val"&&n?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>${body}`;}

// ---- nova FTS ----
function vNova(){const d=state.draft||{id:"",ssom:"",linha:"MDF02",disc:espPerm().length===1?espPerm()[0]:undefined,area:"",titulo:"",tipo:2,classif:0,periodo:"",sup:"",rt:"",como:"",acomp:"",atividades:"",mo:"",nr:""};
 const o=(a,v)=>a.map((x,i)=>`<option value="${i}" ${i===v?"selected":""}>${esc(x)}</option>`).join("");const os=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
 return `<h2>Nova FTS</h2><div class="sub">${d._dup?"Duplicada de "+esc(d._dup)+". Revise antes de salvar.":"Campos com <span class=\"rq\">*</span> são obrigatórios; o resto pode ser preenchido depois."}</div>
 <div class="card"><div class="row"><div><label>Código da FTS<span class="rq"> *</span></label><input data-f="id" value="${esc(d.id)}" placeholder="FTS-MDF2-XXXX-2027"></div><div><label>SS/OM<span class="rq"> *</span></label><input data-f="ssom" value="${esc(d.ssom)}"></div></div>
 <div class="row"><div><label>Linha<span class="rq"> *</span></label><select data-f="linha">${os(LINHAS,d.linha)}</select></div><div><label>Área / equipamento</label><input data-f="area" value="${esc(d.area)}"></div></div>
 <label>Especialidade<span class="rq"> *</span></label><select data-f="disc" data-n="1">${optEsp(d.disc,"— ESCOLHA A ESPECIALIDADE —",espPerm())}</select>
 <label>Título do serviço<span class="rq"> *</span></label><input data-f="titulo" value="${esc(d.titulo)}">
 <div class="row"><div><label>Tipo</label><select data-f="tipo" data-n="1">${o(TIPOS,d.tipo)}</select></div><div><label>Classificação</label><select data-f="classif" data-n="1">${o(CLASSIF,d.classif)}</select></div></div>
 <div class="row3"><div><label>Período</label><input data-f="periodo" value="${esc(d.periodo)}" placeholder="dd/mm a dd/mm/aaaa"></div><div><label>Supervisor</label><input data-f="sup" value="${esc(d.sup)}"></div><div><label>Responsável técnico</label><input data-f="rt" value="${esc(d.rt)}"></div></div>
 <label>Atividades (uma por linha)<span class="rq"> *</span></label><textarea data-f="atividades">${esc(d.atividades)}</textarea>
 <div class="row"><div><label>Mão de obra (ex.: 2 Mecânico ajustador)</label><input data-f="mo" value="${esc(d.mo)}"></div><div><label>NRs exigidas</label><input data-f="nr" value="${esc(d.nr)}" placeholder="NR11, NR12, NR35"></div></div>
 <label>Como (método de execução)</label><textarea data-f="como">${esc(d.como)}</textarea><label>Forma de acompanhamento</label><input data-f="acomp" value="${esc(d.acomp)}"></div>
 <div id="valbox"></div><div class="act"><button class="btn" id="salvar">Salvar no banco</button><button class="btn ghost" id="limpar">Limpar</button></div>`;}
function validar(d){const r=[],req={id:"Código",ssom:"SS/OM",titulo:"Título",linha:"Linha",atividades:"Atividades"};
 Object.keys(req).forEach(k=>{if(!String(d[k]??"").trim())r.push(["bad",req[k]+" obrigatório"]);});
 if(!dOk(d.disc))r.push(["bad","Especialidade obrigatória"]);else if(!espPerm().includes(d.disc))r.push(["bad","Você não pode abrir FTS de "+DISC[d.disc]+" (sua especialidade: "+espPerm().map(i=>DISC[i]).join(", ")+")"]);
 const t=norm((d.titulo||"")+" "+(d.atividades||"")),a=norm(d.area||""),nr=norm(d.nr||"");
 if(/andaime/.test(t)&&a&&!/(andaime|caldeira)/.test(a))r.push(["warn","Título/atividades falam de andaime, mas a área é “"+d.area+"”. Confira se o texto foi herdado de outra FTS."]);
 if(/andaime/.test(t)&&!/nr ?18/.test(nr))r.push(["warn","Serviço com andaime: considerar NR18."]);
 if(/(sifter|prensa|motorredutor|corrente|polia|correia)/.test(t)&&!/nr ?12/.test(nr))r.push(["warn","Máquina/equipamento mecânico: considerar NR12."]);
 if(/(tanque|silo|caldeira|interior|interna)/.test(t)&&!/nr ?33/.test(nr))r.push(["warn","Possível espaço confinado: considerar NR33."]);
 if(/(altura|andaime|telhado)/.test(t)&&!/nr ?35/.test(nr))r.push(["warn","Trabalho em altura: NR35 não listada."]);return r;}
const renderVal=()=>{const r=validar(state.draft||{});$("#valbox").innerHTML=r.length?r.map(x=>`<div class="alert ${x[0]}">${x[0]==="bad"?"✖":"⚠"} ${esc(x[1])}</div>`).join(""):'<div class="alert ok">✔ Tudo certo para salvar.</div>';};

// ---- PDF ----
async function baixarPdf(){const f=FTS.find(x=>x.id===state.sel);if(!window.jspdf){toast("Biblioteca de PDF não carregou");return;}
 const fl=await flatPhotos(f.id);
 const doc=buildPdf({...f,_just:justFts(f)},fl,FERRAMENTAS.filter(t=>f.ferr.includes(t.cod)),TIPOS,CLASSIF,EPI_TEXTO,window.jspdf);
 await saveDoc(doc,f.id+".pdf");}

// ---- fotos ----
function resize(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(async b=>{if(!b)return res(null);res({blob:b,data:await blob2url(b),w:c.width,h:c.height});},"image/jpeg",.72);};im.onerror=()=>res(null);im.src=r.result;};r.onerror=()=>res(null);r.readAsDataURL(file);});}
async function addFiles(files){const id=state.sel;if(!canEdit("fotos")){toast("Sem permissão para fotos");return;}photos[id]=photos[id]||[];let n=0;
 for(const fl of files){if(!/^image\//.test(fl.type))continue;const r=await resize(fl);if(!r)continue;const path=id+"/"+crypto.randomUUID()+".jpg";
  const up=await bucket().upload(path,r.blob,{contentType:"image/jpeg"});if(up.error){dbErr(up.error,"Falha no envio da foto");continue;}
  const ins=await SB.from("fotos").insert({registro:id,path,legenda:"",cat:"Durante",bytes:r.blob.size,w:r.w,h:r.h}).select().single();if(ins.error){dbErr(ins.error);continue;}
  photos[id].push({id:String(ins.data.id),path,cat:"Durante",leg:"",data:r.data,w:r.w,h:r.h,anot:[]});n++;}
 toast(n+" foto(s) enviada(s) · reduzidas automaticamente");render();}

// ---- render/bind ----
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===state.v||({detalhe:"busca",cmd:"cm",cmn:"cm",ced:"ce",cen:"ce"})[state.v]===b.dataset.v));
 $("#main").className=["dash","areas","cm","ce","cmd","cmn","ced","cen","admin"].includes(state.v)?"up":"";
 $("#main").innerHTML=({busca:vBusca,detalhe:vDetalhe,nova:vNova,cat:vCat,dash:vDash,areas:vAreas,cm:vCm,ce:vCe,admin:vAdmin,cmd:vCmDet,cmn:vCmNova,ced:vCeDet,cen:vCeNovo})[state.v]();bind();}
const keep=(id,key)=>{const e=$(id);e.oninput=ev=>{state[key]=ev.target.value;const p=ev.target.selectionStart;render();const n=$(id);n.focus();n.setSelectionRange(p,p);};};
function open(id,tab){state.sel=id;state.tab=tab||"p1";state.v="detalhe";render();window.scrollTo(0,0);}
function bind(){
 if($("#q"))keep("#q","q");if($("#iq"))keep("#iq","iq");if($("#fq"))keep("#fq","fq");
 document.querySelectorAll(".res[data-id]").forEach(c=>c.onclick=()=>open(c.dataset.id));
 document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();open(a.dataset.go);});
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.t;render();});
 document.querySelectorAll("a.lnk[data-t]").forEach(a=>a.onclick=e=>{e.preventDefault();state.tab=a.dataset.t;render();window.scrollTo(0,0);});
 if($("#back"))$("#back").onclick=()=>{state.v="busca";render();};
 if($("#pdf"))$("#pdf").onclick=baixarPdf;
 if($("#fdisc")){$("#fdisc").onchange=e=>{const f=FTS.find(x=>x.id===state.sel);f.disc=pd(e.target.value);persistRec(f);render();};$("#farea").onchange=e=>{const f=FTS.find(x=>x.id===state.sel);f.areaOp=e.target.value;persistRec(f);render();};}
 if($("#dup"))$("#dup").onclick=()=>{const f=FTS.find(x=>x.id===state.sel);state.draft={id:"",ssom:"",linha:f.linha,area:f.area,titulo:f.titulo,tipo:f.tipo,classif:f.classif,periodo:"",sup:f.sup,rt:f.rt,como:f.como,acomp:f.acomp,atividades:f.atividades.join("\n"),mo:f.mo.map(m=>m.q+" "+m.f).join("; "),nr:f.mo.map(m=>m.nr).join(", "),_dup:f.id};state.v="nova";render();};
 bindCm();bindSd();bindDash();bindAdmin();bindExtras();
 if(state.v==="nova"){document.querySelectorAll("[data-f]").forEach(el=>el.oninput=el.onchange=e=>{state.draft=state.draft||{linha:"MDF02",tipo:2,classif:0,disc:espPerm().length===1?espPerm()[0]:undefined};state.draft[el.dataset.f]=el.dataset.n?(e.target.value===""?undefined:+e.target.value):e.target.value;renderVal();});renderVal();
  $("#limpar").onclick=()=>{state.draft=null;render();};
  $("#salvar").onclick=()=>{const d=state.draft||{};if(validar(d).some(x=>x[0]==="bad")){toast("Corrija os campos obrigatórios");return;}if(FTS.some(f=>f.id===d.id)){toast("Código já existe");return;}
   const nf={id:d.id,ssom:d.ssom,pedido:"",nfEnvio:"",nfRetorno:"",linha:d.linha,area:d.area||"",dataProg:d.periodo||"",titulo:d.titulo.toUpperCase(),tipo:d.tipo??2,classif:d.classif??0,periodo:d.periodo||"A definir",sup:d.sup||"—",plan:"—",rt:d.rt||"",status:"Rascunho",exemplo:false,user:true,solicitante:"—",oQue:"",como:d.como||"",acomp:d.acomp||"",atividades:d.atividades.split("\n").filter(Boolean),mo:[{f:d.mo||"",q:"",nr:d.nr||""}],reqMO:[],forn:[],obrG:[],obrC:[],epis:[],alertas:[],ferr:[],disc:d.disc,areaOp:"",sdcv:{}};
   criarFts(nf).then(r=>{if(r.erro){dbErr(r.erro,"Não foi possível salvar: "+(r.erro.message||""));return;}state.draft=null;toast("FTS salva");open(nf.id);});};}
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{state.v=b.dataset.v;state.sel=null;render();window.scrollTo(0,0);});
(async()=>{try{if(window.claude&&claude.use)DL=await claude.use("downloads");}catch(e){DL=null;}})();
boot();

</script></body></html>
